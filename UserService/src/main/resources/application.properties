spring.application.name=user-service
server.port=8081

eureka.instance.appname=user-service
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=${FEASTO_USERS_DB_URL:jdbc:postgresql://localhost:5432/feasto_user_db}
spring.datasource.username=${FEASTO_DB_USERNAME:postgres}
spring.datasource.password=${FEASTO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.password=${FEASTO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${FEASTO_JWT_SECRET}
jwt.expiration=${FEASTO_JWT_EXPIRATION_MS:3600000}
