spring.application.name=order-service

# PostgreSQL
spring.datasource.url=${FEASTO_ORDERS_DB_URL:jdbc:postgresql://localhost:5432/feasto_order}
spring.datasource.username=${FEASTO_DB_USERNAME:postgres}
spring.datasource.password=${FEASTO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.password=${FEASTO_DB_PASSWORD}

# jpa or hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${FEASTO_JWT_SECRET}
feasto.internal-service-token=${FEASTO_INTERNAL_SERVICE_TOKEN}

# Server
server.port=8083

eureka.instance.appname=order-service
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
