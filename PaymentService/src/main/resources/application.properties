spring.application.name=payment-service
server.port=8084

spring.datasource.url=${FEASTO_PAYMENTS_DB_URL:jdbc:postgresql://localhost:5432/feasto_payment}
spring.datasource.username=${FEASTO_DB_USERNAME:postgres}
spring.datasource.password=${FEASTO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.password=${FEASTO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${FEASTO_JWT_SECRET}
feasto.internal-service-token=${FEASTO_INTERNAL_SERVICE_TOKEN}

eureka.instance.appname=payment-service
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
