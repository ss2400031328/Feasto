spring.application.name=restaurant-service
# PostgreSQL Database
spring.datasource.url=${FEASTO_RESTAURANTS_DB_URL:jdbc:postgresql://localhost:5432/feasto_restaurant}
spring.datasource.username=${FEASTO_DB_USERNAME:postgres}
spring.datasource.password=${FEASTO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.password=${FEASTO_DB_PASSWORD}

server.port=8082
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${FEASTO_JWT_SECRET}

eureka.instance.appname=restaurant-service
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
